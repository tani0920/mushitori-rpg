<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>むなかた虫とり日記</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="虫とり日記">
<meta name="theme-color" content="#17261d">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* レイアウト: 携帯ゲーム機の画面(4:3)＋下にコントローラー。夏の夜の森色のフレームに、昔ながらのRPGウィンドウ */
:root{
  --frame:#17261d;      /* 森の夜 */
  --frame-2:#21362a;
  --ink:#f7f1df;        /* ウィンドウ文字 */
  --win:#14284a;        /* ウィンドウ紺 */
  --edge:#f7f1df;
  --sun:#f4b63c;        /* ひまわり */
  --hp:#5ccf6a;
  --hp-low:#e8553e;
  --paper:#f3ead2;      /* 図鑑の紙 */
  --paper-ink:#2c2418;
  --paper-line:#d8c9a3;
  --mute:#a9bba9;
  --f-pixel:"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#screen,#pad{-webkit-touch-callout:none}
body{margin:0;background:var(--frame);color:var(--ink);font-family:var(--f-pixel);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:760px;margin:0 auto;padding-block:10px 16px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:400;letter-spacing:.08em;color:var(--sun)}
header small{color:var(--mute);font-size:12px}
#hud{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;align-items:center;font-variant-numeric:tabular-nums;min-height:22px}
#hud .hp{display:inline-flex;align-items:center;gap:6px}
.bar{display:inline-block;width:70px;height:8px;background:#0006;border:1px solid var(--edge);border-radius:2px;overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--hp)}
.bar i.low{background:var(--hp-low)}
#hud .money{color:var(--sun)}
#hud .time{display:inline-flex;align-items:center;gap:.3em}
#hud .clock{width:1.9em;height:1.9em;flex:none;filter:drop-shadow(0 1px 1px #0008)}
#hud .hrow{display:contents}
#hud .place,#hud .lv{color:#fff}
#screen{position:relative;width:min(100%, calc((100dvh - 250px) * 4 / 3));min-width:min(100%,300px);aspect-ratio:4/3;max-width:100%;margin:0 auto;
  background:#000;border:4px solid var(--frame-2);border-radius:6px;overflow:hidden;container-type:inline-size}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#screen .ov{font-size:clamp(11px,3.3cqw,19px)}
.win{background:var(--win);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 2px var(--win);color:var(--ink);padding:.55em .85em;line-height:1.6}
#msg{position:absolute;left:2.5%;right:2.5%;bottom:3%;min-height:25%;z-index:20;cursor:pointer}
#msg .next{display:inline-block;margin-left:.3em;animation:blink 1s steps(2) infinite;color:var(--sun)}
@keyframes blink{50%{opacity:0}}
#menu{position:absolute;right:2.5%;top:3%;max-height:66%;min-width:40%;max-width:95%;z-index:30;display:flex;flex-direction:column;padding:.4em .5em}
#menu .mt{padding:.1em .4em .3em;color:var(--sun);border-bottom:1px dashed #f7f1df55;margin-bottom:.2em}
#menu .mlist{position:relative;display:flex;min-height:0;flex:1 1 auto}
#menu ul{list-style:none;margin:0;padding:0;overflow-y:auto;position:relative;flex:1;min-width:0;scrollbar-width:none}
#menu ul::-webkit-scrollbar{display:none}
#menu .sbar{flex:none;width:5px;margin:2px 0 2px 6px;border-radius:3px;background:#ffffff22;position:relative}
#menu .sbar i{position:absolute;left:0;right:0;border-radius:3px;background:var(--sun)}
#menu .more{position:absolute;left:50%;transform:translateX(-50%);color:var(--sun);font-size:.8em;line-height:1;pointer-events:none;animation:blink 1s steps(2) infinite;text-shadow:0 0 3px #000}
#menu .more.up{top:-.15em}
#menu .more.dn{bottom:-.35em}
#menu li{display:flex;justify-content:space-between;align-items:baseline;gap:1em;padding:.15em .4em .15em 1.3em;position:relative;cursor:pointer;border-radius:3px}
#menu li span{min-width:0;overflow-wrap:anywhere}
#menu li em{font-style:normal;color:var(--mute);white-space:nowrap;flex:none}
#menu li.sel{background:#ffffff14}
#menu li.sel::before{content:"▶";position:absolute;left:.25em;color:var(--sun)}
#menu li.dis{color:#f7f1df66}
#menu li.dis em{color:#f7f1df55}
#menu.cmditem{top:auto;bottom:31%;right:2.5%;min-width:34%}
#menu.cmd{top:auto;left:2.5%;right:2.5%;bottom:3%;min-height:25%;max-width:none;z-index:31}   /* 戦闘コマンド：メッセージ欄の場所に2列で */
#menu.cmd ul{display:grid;grid-template-columns:1fr 1fr;gap:.25em .8em;overflow:visible}
#menu.cmd li{padding-top:.3em;padding-bottom:.3em}
#menu.map{left:2.5%;right:auto;min-width:62%}
#menu.title{right:auto;left:50%;transform:translateX(-50%);top:60%;min-width:44%}
#menu.side{min-width:32%}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#fade.on{opacity:1}
#screen.shake{animation:shake .3s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}

/* タイトル */
#titleScr{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12%;
  background:linear-gradient(#1b3f7a 0%,#3d77c4 45%,#8fc6e8 62%,#4f9a3c 62%,#2f6b2a 100%);text-align:center}
#titleScr .t1{font-size:clamp(14px,4cqw,22px);color:#fff;letter-spacing:.2em;text-shadow:2px 2px 0 #0008}
#titleScr.art{background-size:cover;background-position:center bottom;image-rendering:pixelated}
#titleScr .logo{width:min(84%,560px);image-rendering:auto;filter:drop-shadow(0 3px 0 #0005);margin:.2em 0 .4em}
#titleScr.art .sun{display:none}
#titleScr.fine{image-rendering:auto}
#titleScr .t2{font-size:clamp(26px,9cqw,54px);color:var(--sun);letter-spacing:.06em;text-shadow:3px 3px 0 #5a2a10,-1px -1px 0 #fff3;line-height:1.15;margin:.15em 0}
#titleScr .t3{font-size:clamp(11px,2.8cqw,16px);color:#fff;text-shadow:1px 1px 0 #0009}
#titleScr .t4{max-width:34em;margin-top:.8em;padding:.35em .8em;font-size:clamp(9px,2.1cqw,12px);line-height:1.5;color:#fff;background:#0006;border-radius:4px}
#titleScr .sun{position:absolute;right:9%;top:8%;width:12%;aspect-ratio:1;border-radius:50%;background:#ffe27a;box-shadow:0 0 0 6px #ffe27a44}

/* バトル */
#battle{position:absolute;inset:0;z-index:5;overflow:hidden;background-size:cover!important;background-position:center bottom!important;image-rendering:pixelated}
#battle.bg-town{background:linear-gradient(#8fd0f0 0 55%,#79b956 55% 100%)}
#battle.bg-tanbo{background:linear-gradient(#92d4f4 0 50%,#a7d75a 50% 58%,#6cae3e 58% 100%)}
#battle.bg-kawara{background:linear-gradient(#9ad8f4 0 46%,#4f93cf 46% 60%,#e2d29c 60% 70%,#69a84a 70%)}
#battle.bg-taisha{background:linear-gradient(#2f6b2a 0 10%,#7cc0a8 10% 48%,#3e7d32 48% 100%)}
#battle.bg-matsubara{background:linear-gradient(#9fdcf6 0 38%,#3f86c8 38% 50%,#efdca4 50% 66%,#5f9e4a 66%)}
#battle.bg-joyama{background:linear-gradient(#a6d0e8 0 30%,#5c8e5a 30% 46%,#3a6f34 46%)}
#battle.bg-oshima{background:linear-gradient(#8fd6f8 0 42%,#2f78c0 42% 56%,#e8d6a0 56% 64%,#5a9a48 64%)}
#battle.night::after{content:"";position:absolute;inset:0;background:#0a1440;opacity:.5;pointer-events:none}
#battle.dusk::after{content:"";position:absolute;inset:0;background:#d8641e;opacity:.22;pointer-events:none}
#bWrap{position:absolute;left:50%;top:21%;width:34%;transform:translateX(-50%);z-index:2}
#bSprite{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;animation:bob 1.2s ease-in-out infinite}
#bShadow{width:70%;height:8%;margin:-4% auto 0;border-radius:50%;background:#0003}
@keyframes bob{50%{transform:translateY(-5%)}}
#bSprite.hit{animation:hit .45s steps(2) 1}
@keyframes hit{0%,100%{opacity:1}25%,75%{opacity:.1}50%{opacity:1;transform:translateX(6%)}}
#netfx{position:absolute;left:5%;top:-30%;width:90%;aspect-ratio:1;border-radius:50%;border:4px solid #fff;opacity:0;z-index:3;
  background:repeating-linear-gradient(45deg,#fff8 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,#fff8 0 2px,transparent 2px 9px)}
#netfx.go{animation:net .7s ease-out forwards}
@keyframes net{0%{opacity:0;transform:translateY(-60%) scale(.6)}40%{opacity:1;transform:translateY(20%) scale(1)}70%{transform:translateY(25%) rotate(-6deg)}100%{opacity:1;transform:translateY(25%) rotate(6deg)}}
.binfo{position:absolute;z-index:4;padding:.35em .7em;line-height:1.4;font-size:.92em}
#bInfo{left:2.5%;top:3%;min-width:36%}
#pInfo{right:2.5%;top:3%;min-width:30%}
.binfo .row{display:flex;justify-content:space-between;gap:.8em;align-items:center}
.binfo .bar{width:100%;height:.6em}
.binfo .stars{color:var(--sun);letter-spacing:.05em}
.binfo .new{color:#ff8a6a}
.binfo .gauge{color:var(--sun);letter-spacing:.1em}
.binfo .lbl{color:var(--mute);font-size:.85em;white-space:nowrap}

/* 図鑑・エンディング（画面全体） */
.full{position:fixed;inset:0;z-index:100;overflow-y:auto;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#dex{background:var(--paper);color:var(--paper-ink)}
#dex .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#dex .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;border-bottom:3px double var(--paper-ink);padding-bottom:6px}
#dex .top h2,#dex .top .btn{white-space:nowrap}
#dex .top .cnt{order:3;flex-basis:100%;font-size:13px}
#dex h2{margin:0;font-weight:400;font-size:20px;letter-spacing:.1em}
#dex .cnt{font-variant-numeric:tabular-nums}
.btn{font:inherit;background:var(--win);color:var(--ink);border:2px solid var(--edge);border-radius:6px;padding:.35em 1em;cursor:pointer}
.btn:focus-visible,#pad button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#dex .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:560px){#dex .body{grid-template-columns:minmax(0,1fr)}#dexDetail{order:-1}}
#dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;align-content:start}
#dexGrid .c{border:2px solid var(--paper-line);border-radius:4px;padding:4px 2px 2px;text-align:center;cursor:pointer;background:#fffaf0;font-size:10px;line-height:1.2}
#dexGrid .c img{width:40px;height:40px;image-rendering:pixelated;display:block;margin:0 auto 2px}
#dexGrid .c.sel{border-color:var(--paper-ink);background:#fff3c4}
#dexGrid .c .no{color:#8a7a5a}
#dexDetail{border:2px solid var(--paper-ink);border-radius:6px;padding:12px;background:#fffaf0;min-width:0;align-self:start}
#dexDetail .hd{display:flex;gap:12px;align-items:center}
#dexDetail img{width:96px;height:96px;image-rendering:pixelated;background:repeating-linear-gradient(0deg,#f3ead2 0 8px,#efe4c8 8px 16px);border-radius:4px;flex:none}
#dexDetail h3{margin:0;font-weight:400;font-size:20px}
#dexDetail .stars{color:#c88a10}
#dexDetail .stars .rl{color:#7a6a4a;font-size:12px;margin-right:2px}
#dexDetail p{margin:.6em 0 0;line-height:1.7}
#dexDetail dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:.8em 0 0;font-size:13px}
#dexDetail dt{color:#7a6a4a}
#dexDetail dd{margin:0}
#dexDetail .note{font-size:12px;color:#7a6a4a;margin-top:.8em}
#dexDetail .real{margin-top:12px;border-top:1px dashed var(--paper-line);padding-top:10px}
#dexDetail .real img{width:100%;height:auto;max-height:220px;object-fit:cover;image-rendering:auto;background:none}
#cam{background:var(--paper);color:var(--paper-ink)}
#cam .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#cam .top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px double var(--paper-ink);padding-bottom:6px}
#cam h2{margin:0;font-weight:400;font-size:20px;letter-spacing:.1em}
#cam h3{margin:8px 0 0;font-weight:400;font-size:17px;border-bottom:1px solid var(--paper-line);padding-bottom:4px}
#cam .lead{margin:0;line-height:1.7}
#cam .lead small{color:#7a6a4a}
.camBtns{display:flex;gap:10px;flex-wrap:wrap}
.camBtns label{flex:1 1 160px;text-align:center;font-size:17px;padding:.8em 1em}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
#camResult:empty{display:none}
#camResult{border:2px solid var(--paper-ink);border-radius:6px;background:#fffaf0;padding:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
#camResult img{width:160px;max-width:100%;border-radius:4px;flex:none}
#camResult .txt{flex:1 1 200px;min-width:0;line-height:1.7}
#camResult .big{font-size:19px}
#camResult .ok{color:#2f7a2a}
#camResult .ng{color:#a8442e}
#camResult ul{margin:.3em 0 0;padding-left:1.2em}
#album{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
#album .a{border:2px solid var(--paper-line);border-radius:4px;background:#fffaf0;padding:4px;text-align:center;font-size:11px;line-height:1.3}
#album .a img,#album .a .no{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;display:block;margin-bottom:3px}
#album .a .no{background:repeating-linear-gradient(45deg,#efe4c8 0 6px,#f6eedb 6px 12px);display:flex;align-items:center;justify-content:center;font-size:22px;color:#c8b890}
#endScr{background:linear-gradient(#1b3f7a,#3d2f6a 60%,#17261d);color:var(--ink);display:flex;align-items:center;justify-content:center}
#endScr .in{max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#endScr h2{margin:0;font-weight:400;color:var(--sun);font-size:26px;letter-spacing:.1em}
#endScr .win{width:100%;text-align:left}
#endScr .ttl{font-size:22px;color:var(--sun);text-align:center}
#endScr img{width:72px;height:72px;image-rendering:pixelated}
img[src^="img/"]{image-rendering:auto!important}   /* ChatGPTで作った細かい絵はなめらかに縮小 */
#endScr .story{font-size:18px;line-height:1.9;min-height:7.5em;text-align:left}
#endScr .dexs{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px;margin:10px 0;background:#f3ead2;border-radius:4px;padding:6px}
#endScr .dexs img{width:100%;height:auto;aspect-ratio:1}
#endScr .score{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
#endScr .score th{text-align:left;font-weight:400;color:var(--mute);padding:3px 0}
#endScr .score td{text-align:right;padding:3px 0}
#endScr .score .sum th,#endScr .score .sum td{color:var(--sun);border-top:1px dashed #f7f1df55;padding-top:6px}
#endScr .bestbug{display:flex;align-items:center;gap:10px;margin-top:10px}
#endScr .bestbug img{width:56px;height:56px}
#endScr .carry{text-align:left;line-height:1.7}
#endScr .carry ul{margin:.3em 0;padding-left:1.2em}
#endScr .carry .lbl{color:var(--mute);font-size:13px}
#endScr .fic{margin:10px 0 0;font-size:12px;color:var(--mute);text-align:center}

/* コントローラー */
#pad{display:none;justify-content:space-between;align-items:center;gap:10px;padding-top:4px}
@media (hover:none),(pointer:coarse){#pad{display:flex}#keys{display:none}}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
#pad button{font:inherit;font-size:18px;color:var(--ink);background:var(--frame-2);border:2px solid #f7f1df55;border-radius:10px;touch-action:none;cursor:pointer}
#pad button:active,#pad button.on{background:#33503f}
.dpad [data-k=U]{grid-area:1/2}.dpad [data-k=L]{grid-area:2/1}.dpad [data-k=R]{grid-area:2/3}.dpad [data-k=D]{grid-area:3/2}
.ab{display:grid;grid-template-columns:64px 64px;gap:10px;align-items:center}
.ab [data-k=A],.ab [data-k=B]{width:64px;height:64px;border-radius:50%!important;grid-row:1}
.ab [data-k=A]{background:#7a3a22!important;border-color:var(--sun)!important}
.ab [data-k=M]{font-size:13px!important;padding:6px 10px;grid-row:2;grid-column:1/3;white-space:nowrap}
/* ===== スマホ・タブレット：ゲーム画面を全画面に、ボタンは上に重ねる ===== */
body.touch{position:fixed;inset:0;overflow:hidden;padding:0}
html:has(body.touch){padding:0}
body.touch #app{max-width:none;height:100%;padding:0;display:block;position:relative}
body.touch header,body.touch #keys{display:none}
body.touch #screen{position:absolute;inset:0;width:100%;height:100%;min-width:0;max-width:none;aspect-ratio:auto;border:0;border-radius:0;z-index:1;
  --hudH:40px;--padH:200px;--sideL:0px;--sideR:0px}
body.touch #hud{position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none;font-size:clamp(13px,3.4vmin,19px);gap:0 10px;min-height:0;
  padding:calc(env(safe-area-inset-top,0px) + 5px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(#000c 60%,#0000);text-shadow:1px 1px 0 #000}
body.touch #hud:empty{display:none}
body.touch #hud .bar{width:min(34vw,180px);height:.6em}
/* スマホ縦・iPad：3行で大きく */
body.touch:not(.land) #hud{display:flex;flex-direction:column;gap:2px;font-size:clamp(15px,4.2vmin,24px);line-height:1.35;padding-bottom:14px;background:linear-gradient(#000d 70%,#0000)}
body.touch:not(.land) #hud .hrow{display:flex;gap:0 .8em;align-items:center;flex-wrap:wrap}
body.touch:not(.land) #hud .date{font-weight:700}
body.touch:not(.land) #hud .place{font-size:1.05em}
body.touch:not(.land) #hud .day,body.touch:not(.land) #hud .time{color:var(--mute)}
body.touch:not(.land) #hud .time{color:#fff}
body.touch:not(.land) #hud .clock{width:2.4em;height:2.4em;margin:-.3em 0}
body.touch.land #hud{font-size:clamp(13px,3.8vmin,18px)}
body.touch.land #hud .bar{width:80px}
body.touch #pad{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:flex-end;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(14px,env(safe-area-inset-left,0px))}
body.touch .dpad,body.touch .ab{pointer-events:auto}
body.touch .dpad{--c:clamp(56px,8.5vmin,80px);grid-template-columns:repeat(3,var(--c));grid-template-rows:repeat(3,var(--c));touch-action:none;
  background:radial-gradient(circle,#0005 0 62%,transparent 63%);border-radius:50%}
body.touch #pad button{background:#21362acc;border-color:#f7f1df88;font-size:20px;box-shadow:0 2px 0 #0006}
body.touch #pad button.on{background:#4a6f55ee}
body.touch .ab{--b:clamp(68px,10vmin,96px);grid-template-columns:var(--b) var(--b);gap:12px}

/* ===== スマホ横向き ===== */

body.touch.land #menu.cmditem{bottom:calc(4.4em + 18px)}
body.touch.land #menu.cmd{bottom:8px;min-height:4.4em}
body.touch.land .binfo{font-size:.75em}
body.touch.land #bInfo{left:calc(var(--sideL) + 8px)}

function genMap(id){

  const set = (x,y,t)=>{ if(x>=0&&y>=0&&x<W&&y<H) m[y][x] = t; };
  const rect = (x0,y0,w,h,t)=>{ for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++) set(x,y,t); };
  const scatter = (t,p)=>{ for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++) if(m[y][x]===',' && R()<p) m[y][x] = t; };

  // どこにでも行けるように道を通す
  const clear = (x,y)=>{ const t = m[y][x]; if(t==='T'||t==='o') m[y][x] = '.'; };

}

const layerCache = {};
/* ChatGPTのタイル（img/sprites/tiles.png：4×4マス・1マス16ドット）
   1段目：草地 草むら 道 砂浜／2段目：田んぼ 水 木 松／3段目：岩 赤い屋根 壁 ドア／4段目：青い屋根 お店の入口 鳥居 おやしろ */
const TILE_IDX = {',':0, '"':1, '.':2, 's':3, 'f':4, '~':5, 'T':6, 'o':8, 'D':11, 'P':13, 'E':2, 'K':2, 'r':2, 'J':0};
let tileSheet = null;
const USE_TILE_ART = false;   // true にするとChatGPTのタイル（img/sprites/tiles.png）でフィールドを描く。false はシンプルな見やすい絵
if(USE_TILE_ART && window.HAS_TILES){ const im = new Image(); im.onload = ()=>{ tileSheet = im; for(const k in layerCache) delete layerCache[k]; }; im.src = av('img/sprites/tiles.png'); }
const tileAtIdx = (g, i, X, Y)=> g.drawImage(tileSheet, (i%4)*TS, Math.floor(i/4)*TS, TS, TS, X, Y, TS, TS);
function drawTileImg(g, m, x, y, st){
  const t = m[y][x], down = (m[y+1]||[])[x];
  let i = TILE_IDX[t];
  if(t==='T' && (st==='matsubara' || st==='oshima')) i = 7;
  if(t==='H') i = down==='H' || down==='D' ? 9 : 10;    // 下も家なら屋根、いちばん下の段は壁
  if(t==='S') i = down==='S' || down==='P' ? 12 : 10;
  if(i==null) return false;
  tileAtIdx(g, i, x*TS, y*TS);
  const X = x*TS, Y = y*TS, px = (c,a,b,w,h)=>{ g.fillStyle = c; g.fillRect(X+a, Y+b, w, h); };
  if(t==='E'){ px('#fff8',6,6,4,1); px('#fff8',7,7,2,2); px('#fff8',4,5,8,1); }                       // 出口の矢じるし
  if(t==='K'){ px('#7a5a3a',1,11,14,4); px('#9a7a52',2,11,12,2); }                                     // 切りかぶの土俵
  return true;
}
function mapLayer(id){
  if(layerCache[id]) return layerCache[id];
  const c = document.createElement('canvas'); c.width = W*TS; c.height = H*TS; const g = c.getContext('2d'), m = maps[id], st = AREAS[id].style;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(!(tileSheet && drawTileImg(g, m, x, y, st))) drawTile(g, m, x, y, st);
  if(tileSheet){   // 鳥居とおやしろは2マスのまん中に1つだけ置く
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const t = m[y][x]; if((t!=='r' && t!=='J') || m[y][x-1]===t) continue;
      tileAtIdx(g, t==='r' ? 14 : 15, x*TS + (m[y][x+1]===t ? TS/2 : 0), y*TS);
    }

}

/* 丸い時計（長針・短針）。夜は文字盤を紺色に */
function clockSVG(m=S.min){
  const h = Math.floor(m/60), mi = m % 60, ha = ((h % 12) + mi/60) * 30, ma = mi * 6, night = slotOf(m)==='yoru';
  const hand = (a, len, w, c)=>{ const r = a*Math.PI/180; return `<line x1="20" y1="20" x2="${(20 + Math.sin(r)*len).toFixed(1)}" y2="${(20 - Math.cos(r)*len).toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`; };
  const ticks = Array.from({length:12}, (_,k)=>{ const r = k*30*Math.PI/180, big = k%3===0, a = big ? 13.5 : 15;
    return `<line x1="${(20+Math.sin(r)*a).toFixed(1)}" y1="${(20-Math.cos(r)*a).toFixed(1)}" x2="${(20+Math.sin(r)*16.5).toFixed(1)}" y2="${(20-Math.cos(r)*16.5).toFixed(1)}" stroke="${night ? '#9fb3d0' : '#5a4a3a'}" stroke-width="${big ? 2 : 1.2}"/>`; }).join('');
  return `<svg class="clock" viewBox="0 0 40 40" role="img" aria-label="${h}時${mi}分"><circle cx="20" cy="20" r="18.5" fill="${night ? '#1c2a52' : '#fbf6e6'}" stroke="#f4b63c" stroke-width="2.5"/>${ticks}`+
    hand(ha, 9.5, 3.2, night ? '#f7f1df' : '#2b2118') + hand(ma, 14, 2, night ? '#f7f1df' : '#2b2118') + `<circle cx="20" cy="20" r="2" fill="#c8402e"/></svg>`;
}

  const s = land ? Math.max(1, Math.min(r.width/(15*TS), r.height/(11*TS), 3.6))    // 横向き：縦11マス見える
                 : Math.max(1, Math.min(r.width/(11*TS), r.height/(9*TS), 3.6));   // 縦向き：横11マス見える

  const padEl = $('pad'), dp = padEl.querySelector('.dpad').getBoundingClientRect(), ab = padEl.querySelector('.ab').getBoundingClientRect();
  const hudH = hudEl.offsetHeight;

  if(slot==='yoru'){ ctx.fillStyle = 'rgba(10,20,70,.48)'; ctx.fillRect(0,0,cv.width,cv.height);
    if(S.area==='kawara'){ for(let i=0;i<10;i++){ const fx = (i*53 + Math.sin(ts/900+i)*22 + 320) % 320, fy = 30 + (i*37)%170 + Math.cos(ts/700+i*2)*10; ctx.fillStyle = `rgba(230,255,120,${.5+.5*Math.sin(ts/300+i)})`; ctx.fillRect(Math.round(fx-camX), Math.round(fy-camY), 2, 2); } } }
  else if(slot==='yu'){ ctx.fillStyle = 'rgba(220,100,30,.2)'; ctx.fillRect(0,0,cv.width,cv.height); }
  else if(slot==='asa' && S.min < 7*60){ ctx.fillStyle = 'rgba(120,160,230,.14)'; ctx.fillRect(0,0,cv.width,cv.height); }
}
async function onStep(){
  S.min += STEP_MIN; hud();
  const t = tileAt(S.x, S.y);
  if(t==='E') await worldMap();
  else if(t==='D') await home();
  else if(t==='P'){ await shop(); S.y += 1; }
  else {
    const A = AREAS[S.area], r = (ENC[t]||0) * (A.rate||1);
    if(Math.random() < r){ const id = pickBug(); if(id) await battle(id); }
  }
  await checkTime();
}
function pickBug(){
  const slot = slotOf(S.min), list = AREAS[S.area].bugs.filter(id=>BUGS[id].time.includes(slot));
  if(!list.length) return null;
  const wt = id=>{ const b = BUGS[id]; let w = b.w;
    if(S.trapDay===S.day && b.rank>=3) w *= 3;            // 樹液トラップ
    if((S.link[b.shape]||0) >= S.day) w *= 2;             // 本物の虫を撮ったなかまが出やすい
    if(id==='kinkabuto' && S.goldwing) w *= 8;            // 金色のはね
    return w; };
  let r = Math.random() * list.reduce((s,id)=>s + wt(id), 0);
  for(const id of list){ r -= wt(id); if(r <= 0) return id; }
  return list[list.length-1];
}

const battleEl = $('battle'), bSprite = $('bSprite');
function catchRate(e){
  const lvDiff = S.lv - e.lv, hpR = e.hp / e.maxhp;
  const hpWeight = clamp(1 - lvDiff*0.05, 0.3, 1.1);           // レベルが高いほどHPの影響が小さくなる
  const lvF = clamp(1 + lvDiff*0.06, 0.35, 1.8);
  return clamp(CAGES[S.cage].pow * (1.15 - hpR*hpWeight) * lvF * e.b.catch * (e.mitsu ? 1.5 : 1), 0.03, 0.97);
}
const expOf = e=> Math.round(e.lv*3 + e.b.rank*6);
function updateB(e){
  const r = e.hp / e.maxhp, pr = S.hp / maxHp(), p = catchRate(e), dots = Math.max(1, Math.ceil(p*5));
  $('bInfo').innerHTML = `<div class="row"><span>${esc(e.b.name)}</span><span>Lv${e.lv}</span></div>`+
    `<div class="row"><span><span class="lbl">レア度</span> <span class="stars">${stars(e.b.rank)}</span></span>${S.dex[e.id] ? '' : '<span class="new">NEW</span>'}</div>`+
    `<span class="bar"><i class="${r<.3?'low':''}" style="width:${r*100}%"></i></span>`+
    `<div class="row"><span class="lbl">つかまえやすさ</span><span class="gauge">${'●'.repeat(dots)}${'○'.repeat(5-dots)}</span></div>`;
  $('pInfo').innerHTML = `<div class="row"><span>ぼく</span><span>Lv${S.lv}</span></div>`+
    `<span class="bar"><i class="${pr<.3?'low':''}" style="width:${pr*100}%"></i></span>`+
    `<div class="row"><span class="lbl">HP</span><span>${S.hp}/${maxHp()}</span></div>`;
}
function fx(el, cls, ms){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), ms); }
async function gainExp(n){
  S.exp += n; await say(`けいけんちを ${n} もらった！`);
  while(S.exp >= need(S.lv)){ S.exp -= need(S.lv); S.lv++; S.hp = Math.min(maxHp(), S.hp + 6); hud(); await say(`レベルが ${S.lv} にあがった！\n（たいりょく+6・こうげき+1.5）`); }
}
async function getBug(e){
  if(S.box.length >= cap()){ await say(`虫かごがいっぱいで、${e.b.name}を入れられなかった…\n虫はにげていった。`); await gainExp(Math.round(expOf(e)/2)); return false; }
  S.box.push({id:e.id, lv:e.lv}); S.caughtTotal++;
  const first = !S.dex[e.id];
  S.dex[e.id] = {n:(S.dex[e.id]?.n||0) + 1, best:Math.max(S.dex[e.id]?.best||0, e.lv)};
  hud();

  await gainExp(expOf(e));

}

async function dangerEncounter(id){
  const b = BUGS[id], slot = slotOf(S.min);
  battleEl.className = 'ov bg-' + AREAS[S.area].style + (slot==='yoru' ? ' night' : slot==='yu' ? ' dusk' : ''); battleBg(AREAS[S.area].style);

  await fade(()=>{ battleEl.hidden = true; scene = 'field'; S.min += 5; hud(); });
}
async function battle(id){
  const b = BUGS[id], lv = b.lv + rint(0,2), k = 1 + 0.08*(lv - b.lv);
  const e = {id, b, lv, maxhp:Math.round(b.hp*k), atk:Math.max(1, Math.round(b.atk*k)), mitsu:false}; e.hp = e.maxhp;
  S.seen[id] = true;
  if(b.danger) return dangerEncounter(id);   // スズメバチは戦わずに逃げる
  const slot = slotOf(S.min);
  battleEl.className = 'ov bg-' + AREAS[S.area].style + (slot==='yoru' ? ' night' : slot==='yu' ? ' dusk' : ''); battleBg(AREAS[S.area].style);
  bSprite.src = spriteURL(id); scene = 'battle';
  if(!imgOK[id] && imgReady[id]) imgReady[id].then(()=>{ if(scene==='battle') bSprite.src = spriteURL(id); });
  await fade(()=>{ battleEl.hidden = false; updateB(e); });
  await say(`あっ！ ${b.name}（Lv${lv}）があらわれた！` + (id==='kinkabuto' ? '\nまぶしい金色の光…！ これが大島の伝説の…！' : b.rank>=4 ? '\nめずらしい虫だ…！' : ''));
  let result = null;
  while(!result){
    const c = await choose(['あみをふる','つかまえる','どうぐ','にげる'], {cls:'cmd', title:`${b.name}を どうする？`, cancel:false});
    let turn = true;
    if(c===0){
      if(Math.random() < b.spd*0.05){ await say(`ブンッ！ ${b.name}にあみをよけられた！`); }
      else {
        let d = patk()*(0.85 + Math.random()*0.3); const crit = Math.random() < 1/12; if(crit) d *= 1.6; d = Math.max(1, Math.round(d));
        // 網の必殺技：たおしてしまいそうな一撃ほど出やすい（ルールA「たおしてゲット」のときは、たおす一撃では出ない）
        const ko = d >= e.hp, so = NETS[S.net].soft;
        if(e.hp > 1 && (ko ? S.rule!=='A' && Math.random() < so.ko : Math.random() < so.any)){
          e.hp = 1; e.stun = 1; fx(bSprite,'hit',450); updateB(e);
          await say(`ひっさつ！「${SOFT_NAME}」！\n${b.name}をやさしくおさえこんだ！ のこりHP1！\n（いまがつかまえるチャンス！）`);
        } else {   // ふつうの一撃
        e.hp = Math.max(0, e.hp - d); fx(bSprite,'hit',450); updateB(e);
        await say((crit ? 'クリーンヒット！ ' : '') + `${b.name}に ${d} のダメージ！`);
        if(e.hp <= 0){
          if(S.rule==='A'){ await getBug(e); }
          else { await say(`${b.name}は弱って、どこかへ飛んでいってしまった…\n（HPを0にすると、つかまえられない）`); await gainExp(Math.round(expOf(e)/2)); }
          result = 'end';
        }
        }
      }
    } else if(c===1){
      if(S.box.length >= cap()){ await say('虫かごがいっぱいだ！\n虫具店で売るか、メニューからにがしてあげよう。'); turn = false; }
      else {
        const p = catchRate(e); fx($('netfx'),'go',900); await wait(700);
        await say('えいっ！ あみをかぶせた！');
        if(Math.random() < p){ await getBug(e); result = 'end'; }
        else await say(`おしい！ ${b.name}はあみからにげだした！`);
      }
    } else if(c===2){ turn = await useItemBattle(e); }
    else { await say('そっと、その場をはなれた…'); result = 'end'; }
    if(result || !turn) continue;
    // 虫のターン
    if(e.stun){ e.stun--; await say(`${b.name}はひるんでいて、動けない！`); continue; }
    const hpR = e.hp / e.maxhp;
    if(Math.random() < b.spd*0.025 + (hpR < .35 ? .06 : 0)){ await say(`${b.name}は飛んでにげてしまった！`); result = 'end'; break; }
    const d = Math.max(1, Math.round(e.atk*(0.8 + Math.random()*0.4)));
    S.hp = Math.max(0, S.hp - d); fx(screenEl,'shake',300); updateB(e); hud();
    await say(`${b.name}は${ATTACK[b.shape]}\n${d} のダメージをうけた！`);
    if(S.hp <= 0){ await say('目の前がくらくらする…熱中症かも！\nいそいで家に帰って休もう。'); result = 'faint'; }
  }
  await fade(()=>{ battleEl.hidden = true; scene = 'field'; S.min += BATTLE_MIN; hud(); });
  if(result==='faint'){ await faintPenalty(); await sleep(true); }
}

const sumoNext = ()=> S.area==='town' && RIVALS.find((r,i)=>!(S.sumo||{})[r.key] && (i===0 || (S.sumo||{})[RIVALS[i-1].key]));
function fighter(id, lv, mine){
  // 虫ずもうの強さは「レベル×タイプ」で決まる（めずらしい虫ほどレベルが高いので強い）。ぼくのレベルが高いほど、おうえんで少し強くなる
  const b = BUGS[id], t = typeOf(b), cheer = mine ? 1 + (S.lv-1)*0.02 : 1;
  const maxhp = Math.round((28 + lv*4.2) * t.hp);
  return {id, b, t, sp:SP_MOVES[b.shape], lv, maxhp, hp:maxhp, atk:(5 + lv*0.8) * t.atk * cheer, spd:b.spd,
    guard:false, open:1, blind:0, weak:1, poison:0, lastGuard:false};
}
const mark = (v, hi, lo)=> v >= hi ? '◎' : v <= lo ? '△' : '○';
const fstat = f=> `${f.t.name}タイプ　たいりょく${f.maxhp}　ちから${Math.round(f.atk)}\nまもり${mark(1/f.t.def, 1.12, 0.96)}　すばやさ${mark(f.spd, 4, 1)}　かいふく${mark(f.t.heal, 0.16, 0.08)}\nひっさつ：${f.sp.name}（${f.sp.info}）`;
async function sumoRules(){
  await talk('【虫ずもうのルール】\nつっこむ：ふつうのこうげき。\nひっさつわざ：つよいけど、つぎに動くまでスキができて、受けるダメージが1.5倍になる。',
    'ふんばる：受けるダメージを大きくへらして、たいりょくを回復する。回復する量は虫のタイプでちがう。2回つづけると回復は半分。',
    '【虫のタイプ】\n甲虫：ちから・まもりが強いけど、おそい。\nチョウ：よわいけど、ふんばるでたくさん回復。りんぷんで相手の攻撃をはずさせる。',
    'トンボ：とても速くて、ひっさつわざが当たりやすい。\nバッタ・カマキリ：バランス型。カマキリは2回こうげき。',
    'セミ：大音量で相手のちからを下げる。\nハチ：ちからが強く、どくでダメージをあたえる。\nホタル・アメンボ：目くらましと回復がとくい。',
    'すばやさが高い虫が先に動く。相手のタイプを見て、作戦を立てよう！');
}
async function sumoMenu(){
  S.sumo = S.sumo || {}; S.sumoDay = S.sumoDay || {};
  await say('広場の切りかぶの上で、近所の子どもたちが虫ずもうをしている！');
  if(!S.sumoRuleSeen){ S.sumoRuleSeen = true; await say('ゆうた「虫ずもう、はじめて？ やり方をおしえてあげるね！」'); await sumoRules(); }
  while(true){
    const opts = RIVALS.map((r,i)=>{
      const won = S.sumo[r.key], locked = i>0 && !S.sumo[RIVALS[i-1].key], done = S.sumoDay[r.key]===S.day;
      return {label: locked ? '？？？' : r.name,
        note: locked ? '' : done ? '今日はおわり' : won ? `再戦 ${Math.round(r.money/4)}円` : `賞金 ${r.money}円`,
        desc: locked ? '前の相手に勝つと、挑戦できるようになる' : `あいての虫：${BUGS[r.bug].name} Lv${r.lv}（${typeOf(BUGS[r.bug]).name}タイプ）` + (won ? '\n勝ったことがある。再戦は1日1回' : ''),
        disabled: locked || done};
    });
    opts.unshift({label:'虫ずもうのルール', desc:'わざとタイプの説明'});   // いちばん上
    opts.push({label:'やめる'});
    // カーソルは「まだ勝っていない相手」→「今日たたかえる相手」の順で、えらべるところに合わせる
    const can = RIVALS.map((r,j)=>!opts[j+1].disabled);
    let start = RIVALS.findIndex((r,j)=>can[j] && !S.sumo[r.key]);
    if(start<0) start = can.indexOf(true);
    start = start<0 ? RIVALS.length + 1 : start + 1;   // 先頭はルールなので +1
    const c0 = await choose(opts, {title:'虫ずもう', start});
    if(c0===0){ await sumoRules(); continue; }
    if(c0<0 || c0===RIVALS.length + 1) return;
    const c = c0 - 1;
    if(!S.box.length){ await say('虫かごに虫がいないと、虫ずもうに出られない…。'); return; }
    const m = await choose(S.box.map(it=>({label:`${BUGS[it.id].name} Lv${it.lv}`, desc:fstat(fighter(it.id, it.lv, true))})), {title:'どの虫で勝負する？'});
    if(m<0) continue;
    await sumoBattle(RIVALS[c], S.box[m]);
    hud();
    if(S.min >= END_MIN) return;
  }
}
async function sumoBattle(r, it){
  const me = fighter(it.id, it.lv, true), foe = fighter(r.bug, r.lv, false), mSprite = $('mSprite');
  const first = !S.sumo[r.key];
  const upd = ()=>{
    const fr = foe.hp/foe.maxhp, mr = me.hp/me.maxhp;
    const st = f=> [f.open>1 ? '<span class="new">スキ</span>' : '', f.blind ? '<span class="lbl">めくらまし</span>' : '', f.weak<1 ? '<span class="lbl">ちから↓</span>' : '', f.poison ? '<span class="new">どく</span>' : ''].join(' ');
    $('bInfo').innerHTML = `<div class="row"><span>${esc(r.short)}の${esc(foe.b.name)}</span></div><div class="row"><span class="lbl">Lv${foe.lv}・${foe.t.name}</span><span>${foe.hp}/${foe.maxhp}</span></div><span class="bar"><i class="${fr<.3?'low':''}" style="width:${fr*100}%"></i></span><div class="row">${st(foe)}</div>`;
    $('pInfo').innerHTML = `<div class="row"><span>ぼくの${esc(me.b.name)}</span></div><div class="row"><span class="lbl">Lv${me.lv}・${me.t.name}</span><span>${me.hp}/${me.maxhp}</span></div><span class="bar"><i class="${mr<.3?'low':''}" style="width:${mr*100}%"></i></span><div class="row">${st(me)}</div>`;
  };
  battleEl.className = 'ov bg-town vs'; battleBg('town'); bSprite.src = spriteURL(foe.id); mSprite.src = spriteURL(me.id); scene = 'battle';
  [[foe.id, bSprite], [me.id, mSprite]].forEach(([id, el])=>{ if(!imgOK[id] && imgReady[id]) imgReady[id].then(()=>{ if(scene==='battle') el.src = spriteURL(id); }); });
  await fade(()=>{ battleEl.hidden = false; upd(); });
  await say(`${r.short}「${r.hi}」`);
  await say('はっけよーい……のこった！');
  const name = (f)=> f===me ? `ぼくの${me.b.name}` : `${r.short}の${foe.b.name}`;
  const act = async (a, d, cmd)=>{
    a.open = 1;   // 自分が動いたら、ひっさつわざのスキはなくなる
    if(cmd===2){   // ふんばる：タイプで回復量がちがう。2回つづけると半分
      const h = Math.max(1, Math.round(a.maxhp * a.t.heal * (a.lastGuard ? 0.5 : 1))); a.hp = Math.min(a.maxhp, a.hp + h); a.lastGuard = true; upd();
      await say(`${name(a)}は、ぐっとふんばった！（たいりょく+${h}）`); return;
    }
    a.lastGuard = false;
    const sp = cmd===1, mv = a.sp, wname = sp ? mv.name + '！' : 'つっこみ！';
    let hit = (sp ? mv.acc : .95) - d.spd*0.03 + a.spd*0.02;
    if(a.blind){ hit *= 0.55; a.blind--; }
    if(sp) a.open = mv.open;   // ひっさつわざを使うと、つぎに動くまでスキができる
    if(Math.random() > hit){ upd(); await say(`${name(a)}の${wname}\n…ひらりとかわされた！`); return; }
    const times = sp && mv.hits || 1; let total = 0;
    for(let n=0; n<times; n++){
      const guard = d.guard && !(sp && mv.pierce) ? 0.4 : 1;
      total += Math.max(1, Math.round(a.atk * a.weak * (0.85 + Math.random()*0.3) * (sp ? mv.mult : 1) * d.t.def * guard * d.open));
    }
    d.hp = Math.max(0, d.hp - total); fx(d===me ? mSprite : bSprite, 'hit', 450); if(d===me) fx(screenEl,'shake',300);
    const notes = [];
    if(d.open > 1) notes.push('スキをつかれた！');
    if(d.guard) notes.push(sp && mv.pierce ? 'ふんばりをつきやぶった！' : 'ふんばってダメージをへらした');
    if(sp && mv.blind){ d.blind = mv.blind; notes.push(`${name(d)}は目がくらんだ！`); }
    if(sp && mv.weaken){ d.weak = Math.max(0.6, d.weak * mv.weaken); notes.push(`${name(d)}のちからが下がった！`); }
    if(sp && mv.poison){ d.poison = mv.poison; notes.push(`${name(d)}はどくをうけた！`); }
    upd();
    await say(`${name(a)}の${wname}${times>1 ? `（${times}回）` : ''}\n${total} のダメージ！ ${notes.join(' ')}`);
  };
  let result = null;
  while(!result){
    const c = await choose(['つっこむ', me.sp.name, 'ふんばる', 'こうさん'], {cls:'cmd', cancel:false, title:`ぼくの${me.b.name}、どうする？`, start:0});
    if(c===3){ await say('「まいった！」…こうさんした。'); result = 'lose'; break; }
    // あいての作戦：回復がとくいな虫は弱るとふんばる。ふつうは3回に1回くらいひっさつわざ
    const low = foe.hp < foe.maxhp*0.35, rnd = Math.random();
    const fc = low && !foe.lastGuard && rnd < (foe.t.heal >= .14 ? .6 : .3) ? 2 : rnd < .33 ? 1 : rnd < .4 && !foe.lastGuard ? 2 : 0;
    me.guard = c===2; foe.guard = fc===2;
    const order = me.spd > foe.spd || (me.spd===foe.spd && Math.random() < .5) ? [[me,foe,c],[foe,me,fc]] : [[foe,me,fc],[me,foe,c]];
    for(const [a,d,cmd] of order){
      await act(a, d, cmd);
      if(d.hp <= 0){ result = d===foe ? 'win' : 'lose'; await say(`${name(d)}は、切りかぶの外へころがり落ちた！\nしょうぶあり！`); break; }
    }
    for(const f of [me, foe]){   // ターンの終わりに、どくのダメージ
      if(result || !f.poison) continue;
      const pd = Math.max(1, Math.round(f.maxhp*0.06)); f.hp = Math.max(0, f.hp - pd); f.poison--; upd();
      await say(`${name(f)}は、どくで ${pd} のダメージ！`);
      if(f.hp <= 0){ result = f===foe ? 'win' : 'lose'; await say(`${name(f)}は、切りかぶの外へころがり落ちた！\nしょうぶあり！`); }
    }
  }
  S.min += 20;
  if(result==='win'){
    await say(`${r.short}「${r.win}」`);
    const money = first ? r.money : Math.round(r.money/4); S.money += money;
    let msg = `虫ずもうに勝った！ 賞金 ${money}円 をもらった！`;
    if(first){
      if(r.item==='champ'){ S.sumoChamp = true; msg += `\n「虫ずもうチャンピオン」になった！（自由研究 +${SUMO_CHAMP_PT}点）`; }
      else { const t = [...ITEMS, ...PHOTO_ITEMS].find(t=>t.key===r.item); S.items[r.item] = (S.items[r.item]||0) + 1; msg += `\nさらに ${t.name} をもらった！`; }
    }
    S.sumo[r.key] = (S.sumo[r.key]||0) + 1;
    hud(); await say(msg);
    const nx = RIVALS[RIVALS.indexOf(r) + 1];
    if(first && nx) await say(`つぎの相手「${nx.name}」と勝負できるようになった！`);
    if(first && !nx) await say('虫ずもうの相手は、ぜんぶたおした！');
  } else {
    await say(`${r.short}「${r.lose}」`);
  }
  S.sumoDay[r.key] = S.day;   // 同じ相手とは1日1回
  await fade(()=>{ battleEl.hidden = true; battleEl.className = 'ov'; scene = 'field'; hud(); });
}

function openDex(){
  return new Promise(res=>{
    const ids = Object.keys(BUGS), grid = $('dexGrid'), det = $('dexDetail'); let i = 0;
    { const r = research(); $('dexCnt').textContent = `${dexCount()} / ${ids.length} しゅるい　自由研究 ${r.total}点（いまなら${endingOf(r).award}）`; }
    const where = id=> Object.values(AREAS).filter(a=>a.bugs.includes(id)).map(a=>a.name).join('・');
    const render = ()=>{
      grid.innerHTML = ids.map((id,j)=>{ const got = S.dex[id], seen = S.seen[id];
        return `<div class="c ${j===i?'sel':''}" data-j="${j}"><img alt="" src="${spriteURL(id, !got)}"><span class="no">No.${String(j+1).padStart(2,'0')}</span><br>${got||seen ? esc(BUGS[id].name) : '？？？'}</div>`; }).join('');
      const id = ids[i], b = BUGS[id], got = S.dex[id], seen = S.seen[id];
      det.innerHTML = `<div class="hd"><img alt="" src="${spriteURL(id, !got)}"><div><div>No.${String(i+1).padStart(2,'0')}</div><h3>${got||seen ? esc(b.name) : '？？？'}</h3><div class="stars">${got ? `<span class="rl">レア度</span> ${stars(b.rank)}` : ''}</div></div></div>`+
        (got ? `<p>${fmt(b.desc)}</p><dl><dt>ゲームで出る場所</dt><dd>${esc(where(id))}</dd><dt>時間</dt><dd>${b.time.map(t=>SLOT_NAMES[t]).join('・')}</dd>${got.watched ? '<dt>きろく</dt><dd>遠くから観察した（危ないのでつかまえない）</dd>' : `<dt>つかまえた数</dt><dd>${got.n}ひき</dd><dt>さいこうLv</dt><dd>${got.best}</dd><dt>売り値のめやす</dt><dd>${b.price}円</dd>`}</dl><p class="note">※出る場所はゲーム用です。実際にその場所にいるとはかぎりません。</p>`
             : seen ? `<p>見かけたけど、まだつかまえていない。</p>` : `<p>まだ見たことがない虫。</p>`) +
        (()=>{ const r = realPhotoFor(b.shape); return r && r[1].img ? `<div class="real"><div>本物の${esc(PHOTO_CATS[r[0]].name)}の写真</div><img alt="" src="${r[1].img}"></div>` : ''; })();
      grid.querySelector('.sel')?.scrollIntoView({block:'nearest'});
    };
    const close = ()=>{ uiHandler = null; $('dex').hidden = true; res(); };
    uiHandler = k=>{
      const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
      if(k==='L') i--; else if(k==='R') i++; else if(k==='U') i -= cols; else if(k==='D') i += cols; else if(k==='B'||k==='M') return close(); else return;
      i = clamp(i, 0, ids.length-1); render();
    };
    grid.onclick = ev=>{ const c = ev.target.closest('.c'); if(c){ i = +c.dataset.j; render(); } };
    $('dexClose').onclick = close;
    $('dex').hidden = false; render();
  });
}

};
const LABEL2CAT = {}; Object.entries(PHOTO_CATS).forEach(([k,c])=>c.labels.forEach(l=>LABEL2CAT[l]=k));
function loadPhotos(){ let p; try{ p = JSON.parse(localStorage.getItem(PHOTO_KEY)); }catch(e){} p = p || {}; p.cats = p.cats || {}; p.hashes = p.hashes || []; p.daily = p.daily || {date:'', n:0}; return p; }
let photos = loadPhotos();
function savePhotos(){ try{ localStorage.setItem(PHOTO_KEY, JSON.stringify(photos)); return true; }catch(e){ return false; } }
const todayKey = ()=> new Date().toLocaleDateString('ja-JP');
const photoLeft = ()=> photos.daily.date===todayKey() ? Math.max(0, PHOTO_DAILY - photos.daily.n) : PHOTO_DAILY;
const realPhotoFor = shape=> Object.keys(PHOTO_CATS).map(k=>photos.cats[k] && PHOTO_CATS[k].shapes.includes(shape) ? [k,photos.cats[k]] : null).find(Boolean);

function loadScript(src){ return new Promise((res,rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = ()=>rej(new Error(src)); document.head.appendChild(s); }); }
let aiModel = null;
async function getModel(){
  if(aiModel) return aiModel;
  if(!window.tf) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
  if(!window.mobilenet) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
  aiModel = await mobilenet.load({version:2, alpha:1.0, modelUrl:MODEL_URL});
  return aiModel;
}
function fileToImage(file){ return new Promise((res,rej)=>{ const u = URL.createObjectURL(file), im = new Image(); im.onload = ()=>res(im); im.onerror = rej; im.src = u; }); }
function scaled(im, max){ const r = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth*r); c.height = Math.round(im.naturalHeight*r); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c; }
function aHash(im){ const c = document.createElement('canvas'); c.width = c.height = 8; const g = c.getContext('2d'); g.drawImage(im, 0, 0, 8, 8);
  const d = g.getImageData(0,0,8,8).data, v = []; for(let i=0;i<64;i++) v.push(d[i*4]*.3 + d[i*4+1]*.59 + d[i*4+2]*.11);
  const avg = v.reduce((a,b)=>a+b, 0) / 64; return v.map(x=>x>avg ? 1 : 0).join(''); }
const hamming = (a,b)=> [...a].reduce((n,ch,i)=>n + (ch!==b[i]), 0);

function renderAlbum(){
  const keys = Object.keys(PHOTO_CATS).filter(k=>k!=='hachi'), got = keys.filter(k=>photos.cats[k]).length;   // ハチはアルバムにのせない
  $('albumCnt').textContent = `${got} / ${keys.length}`;
  $('camCnt').textContent = `今日のこり ${photoLeft()}まい`;
  $('album').innerHTML = keys.map(k=>{ const p = photos.cats[k];
    return `<div class="a">${p ? `<img alt="" src="${p.img}">` : '<div class="no">？</div>'}${esc(PHOTO_CATS[k].name)}${p ? `<br><span style="color:#8a7a5a">${p.n}まい</span>` : ''}</div>`; }).join('');
}
function camResult(html){ $('camResult').innerHTML = html; }
async function handlePhoto(file){
  if(!file) return;
  const im = await fileToImage(file).catch(()=>null);
  if(!im){ camResult('<div class="txt ng">写真を読みこめなかった…。べつの写真でためしてね。</div>'); return; }
  const thumb = scaled(im, 360).toDataURL('image/jpeg', .72);
  const head = `<img alt="" src="${thumb}">`;
  if(photoLeft() <= 0){ camResult(head + '<div class="txt ng big">今日のぶんはおしまい！</div><div class="txt">ごほうびは1日5まいまで。また明日、外で虫をさがしてみよう。</div>'); return; }
  const h = aHash(im);
  if(photos.hashes.some(x=>hamming(x,h) <= 4)){ camResult(head + '<div class="txt ng big">この写真はもう見せてもらったよ！</div><div class="txt">ちがう虫か、べつの角度で撮ってみよう。</div>'); return; }
  camResult(head + '<div class="txt">AIが写真を調べているよ…<br><small>（はじめての時は準備に少し時間がかかります）</small></div>');
  let preds;
  try{ const model = await getModel(); preds = await model.classify(scaled(im, 448), 20); }
  catch(e){ camResult(head + '<div class="txt ng">AIを読みこめなかった…。インターネットにつながっているか確かめて、もう一度ためしてね。</div>'); return; }
  const score = {}; let total = 0;
  preds.forEach(p=>{ const k = LABEL2CAT[p.className.split(',')[0].trim()]; if(k){ score[k] = (score[k]||0) + p.probability; total += p.probability; } });
  const cat = Object.keys(score).sort((a,b)=>score[b]-score[a])[0];
  if(!cat || total < PHOTO_MIN){
    camResult(head + `<div class="txt ng big">うーん、虫が見つからないみたい…</div><div class="txt">虫に近づいて、虫が大きく写るように撮ってみよう。${cat ? `<br><small>（${esc(PHOTO_CATS[cat].name)}かも？ ${Math.round(total*100)}%）</small>` : ''}</div>`);
    return;
  }
  if(cat==='hachi'){   // ハチに近づいて撮るのは危ないので、ごほうびは出さない
    camResult(head + '<div class="txt"><div class="ng big">ハチかも！ 気をつけて！</div>ハチ（とくにスズメバチ）は、さされるととても危険です。<br>写真をとるために近づいたりしないでね。<br><small>ハチの写真では、ごほうびはもらえません。</small></div>');
    return;
  }
  // ごほうび
  const C = PHOTO_CATS[cat], first = !photos.cats[cat], gifts = [];
  const money = C.money * (first ? 2 : 1); S.money += money; gifts.push(`おこづかい ${money}円${first ? '（はじめてボーナス2倍！）' : ''}`);
  if(C.item && (first || Math.random() < .35)){ const it = PHOTO_ITEMS.find(t=>t.key===C.item); S.items[C.item] = (S.items[C.item]||0) + 1; gifts.push(`${it.name}（${it.desc}）`); }
  if(cat==='kabuto' && !S.goldwing){ S.goldwing = true; gifts.push('金色のはね！ 大島の伝説の虫「ミアレカブト」が出やすくなった…！'); }
  if(C.shapes.length){ C.shapes.forEach(s=>S.link[s] = S.day + 1); gifts.push(`ゲームの中で${C.name}が出やすくなった（明日まで）`); }
  photos.cats[cat] = {img:thumb, n:(photos.cats[cat]?.n||0) + 1, date:todayKey()};
  photos.hashes.push(h); if(photos.hashes.length > 300) photos.hashes.shift();
  photos.daily = {date:todayKey(), n:(photos.daily.date===todayKey() ? photos.daily.n : 0) + 1};
  if(!savePhotos()){ photos.cats[cat].img = ''; savePhotos(); }
  save(); hud(); renderAlbum();
  camResult(head + `<div class="txt"><div class="ok big">${esc(C.name)}だ！</div><small>AIのはんてい ${Math.round(score[cat]*100)}%</small>${first ? '<div>アルバムに登録された！</div>' : ''}<ul>${gifts.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`);
}

      '図鑑には、虫が少ししかのっていなかった…。',
      '先生「…ええと、表紙の絵がとっても上手だね！」',
      'クラスのみんなは、ほかの子の自由研究に夢中だ。',
      'ぼくの夏休みって、いったい…。\n来年こそリベンジだ！',
    ],
  }[e.key];
  return [...open, ...body];
}
async function ending(){
  scene = 'end';
  const r = research(), e = endingOf(r), lines = endingStory(e, r);
  const el = $('endIn'); $('endScr').hidden = false;
  const next = ()=> new Promise(res=>{ uiHandler = k=>{ if(k==='A'){ uiHandler = null; res(); } }; const b = $('endBtn'); if(b) b.onclick = ()=>{ uiHandler = null; res(); }; });
  // おはなし
  for(const l of lines){
    el.innerHTML = `<h2>二学期のはじまり</h2><div class="win story">${fmt(l)}</div><button class="btn" id="endBtn">つぎへ ▼</button>`;
    await next();
  }
  // 結果と、次の夏休みへの引きつぎ
  const total = Object.keys(BUGS).length;
  const prev = loadCarry(), boxValue = S.box.reduce((s,it)=>s + sellPrice(it), 0);
  const best = Math.max(prev?.best || 0, r.total), newBest = !prev || r.total > (prev.best || 0);
  const carry = {round:(S.round||1) + 1, lv:S.lv, exp:S.exp, net:S.net, cage:S.cage, shoes:S.shoes, items:S.items, money:S.money + boxValue,
    goldwing:S.goldwing, ticket:S.ticket, visited:S.visited, best, lastScore:r.total, lastAward:e.award};
  saveCarry(carry);
  el.innerHTML = `<h2>自由研究「ぼくの昆虫図鑑」</h2>
    <div class="win">
      <div class="ttl">${esc(e.award)}</div>
      <div class="dexs">${Object.keys(BUGS).map(id=>`<img alt="" title="${esc(BUGS[id].name)}" src="${spriteURL(id, !S.dex[id])}">`).join('')}</div>
      <table class="score">
        <tr><th>図鑑にのった虫</th><td>${r.species} / ${total} しゅるい</td></tr>
        <tr><th>レア度ポイント</th><td>${r.rare} 点</td></tr>
        <tr><th>本物の虫の写真</th><td>${r.photo} 点</td></tr>
        <tr><th>がんばり（のべ ${S.caughtTotal}ひき）</th><td>${r.effort} 点</td></tr>
        ${r.sumo ? `<tr><th>虫ずもうチャンピオン</th><td>${r.sumo} 点</td></tr>` : ''}
        <tr class="sum"><th>自由研究の点数</th><td>${r.total} 点</td></tr>
      </table>
      ${r.best ? `<div class="bestbug"><img alt="" src="${spriteURL(r.best)}"><span>いちばんすごい虫<br>${esc(BUGS[r.best].name)}<br><span class="lbl">レア度</span> ${stars(BUGS[r.best].rank)}</span></div>` : ''}
      <div style="text-align:center;margin-top:10px">あなたの称号は…</div><div class="ttl">「${esc(e.title)}」</div>
      ${r.kin ? '<p class="fic">※ミアレカブトは、このゲームのための架空の昆虫です。</p>' : ''}
    </div>
    <div class="win carry">
      <div class="ttl">${newBest ? '自己ベスト更新！' : `自己ベスト ${best}点`}</div>
      <div>次の夏休み（小学${grade(carry.round)}年生）に、引きつげるもの：</div>
      <ul><li>レベル ${S.lv}</li><li>${esc(NETS[S.net].name)}・${esc(CAGES[S.cage].name)}・${esc(SHOES[S.shoes].name)}</li>
        <li>どうぐ（スポーツドリンク${S.items.drink}・虫みつ${S.items.mitsu}・樹液トラップ${S.items.jueki||0}・観察ノート${S.items.note||0}${S.goldwing ? '・金色のはね' : ''}${S.ticket ? '・乗船チケット' : ''}）</li>
        <li>お金 ${carry.money}円${boxValue ? `（虫かごにのこった${S.box.length}ひきを売った${boxValue}円をふくむ）` : ''}</li></ul>
      <div class="lbl">タイトルの「引きつぎではじめる」から遊べます。図鑑はいちからつくりなおしです。</div>
    </div>
    <button class="btn" id="endBtn">タイトルへもどる</button>`;
  await next();
  $('endScr').hidden = true; clearSave(); S = newState();
  await titleScreen();
}

/* =========================================================
   起動
   ========================================================= */
requestAnimationFrame(loop);
window.claude?.hot?.snapshot?.(()=>({save:JSON.stringify(S), scene}));
function start(data){
  if(data && data.save && data.scene==='field'){ try{ S = loadState(data.save); scene = 'field'; $('titleScr').hidden = true; hud(); return; }catch(e){} }
  const demo = QS.get('demo');
  if(demo){ S = newState(); scene = 'field'; $('titleScr').hidden = true; S.area = 'taisha'; S.x = 9; S.y = 9; if(QS.get('min')) S.min = +QS.get('min'); hud(); layout();
    if(demo==='battle'){ run(()=>battle(QS.get('id') || 'kabuto')); for(let k=0;k<+(QS.get('skip')||0);k++) setTimeout(()=>press('A'), 1000 + k*250); }
    else if(demo==='dex'){ Object.keys(BUGS).slice(0, +(QS.get('n')||12)).forEach(id=>S.dex[id] = {n:1, best:BUGS[id].lv}); S.seen.kokuwa = true; if(QS.has('hachi')) S.dex.suzumebachi = {n:0, best:0, watched:true}; setTimeout(()=>{ run(openDex); if(QS.has('hachi')) setTimeout(()=>{ for(let k=0;k<26;k++) press('R'); }, 300); }, 600); }
    else if(demo==='menu') run(fieldMenu);
    else if(demo==='sumo'){ S.area = 'town'; S.x = 13; S.y = 10; S.dir = 'U'; S.box = [{id:QS.get('id')||'kokuwa', lv:12}]; hud();
      if(QS.has('fight')) run(()=>sumoBattle(RIVALS[+QS.get('fight')||0], S.box[0])); else run(()=>say('7月…')); }
    else if(demo==='items'){ Object.assign(S.items, {jueki:2, note:1}); S.goldwing = true; run(itemMenu); }
    else if(demo==='shop') run(()=>buyGear('cage'));
    else if(demo==='box'){ S.box = Array.from({length:14}, (_,k)=>({id:['abura','kabuto','genji','ageha'][k%4], lv:k+3})); run(boxMenu); }
    else if(demo==='end'){ const n = +(QS.get('n')||10); Object.keys(BUGS).slice(0, n).forEach(id=>S.dex[id] = {n:1, best:BUGS[id].lv}); if(QS.has('kin')) S.dex.kinkabuto = {n:1, best:25};
      S.caughtTotal = n*2; run(ending); const skip = +(QS.get('skip')||0); for(let k=0;k<skip;k++) setTimeout(()=>press('A'), 300 + k*120); }
    else run(()=>say(`${dateStr()}。いよいよ虫とりの日がやってきた！`));
    return; }
  run(titleScreen);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
